<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産管理アプリ</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Firebase SDK (Compat version for v8 syntax) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>資産管理アプリ</h1>
            <div class="total-balance">
                <span class="label">総資産:</span>
                <span class="amount" id="totalBalance">¥0</span>
            </div>
        </header>

        <main>
            <!-- Tabs Navigation -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="dashboard">ダッシュボード</button>
                <button class="tab-btn" data-tab="accounts">口座</button>
                <button class="tab-btn" data-tab="history">履歴</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Dashboard Tab -->
                <div class="tab-pane active" id="dashboard-tab">
                    <div class="section-header">
                        <h2>ダッシュボード</h2>
                        <button class="btn btn-primary" id="addAccountBtn">口座を追加</button>
                    </div>
                    <div class="dashboard-content">
                        <div class="charts-container">
                            <div class="chart-wrapper">
                                <h3>資産分布</h3>
                                <canvas id="distributionChart"></canvas>
                            </div>
                            <div class="chart-wrapper">
                                <h3>残高推移</h3>
                                <canvas id="trendChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Accounts Tab -->
                <div class="tab-pane" id="accounts-tab">
                    <div class="section-header">
                        <h2>口座</h2>
                        <button class="btn btn-primary" id="addAccountBtn2">口座を追加</button>
                    </div>
                    <div class="accounts-grid" id="accountsGrid">
                        <!-- Accounts will be dynamically inserted here -->
                    </div>
                </div>

                <!-- History Tab -->
                <div class="tab-pane" id="history-tab">
                    <div class="section-header">
                        <h2>残高履歴</h2>
                        <select id="historyAccountFilter">
                            <option value="all">すべての口座</option>
                        </select>
                    </div>
                    <div class="history-list" id="historyList">
                        <!-- History will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Account Modal -->
    <div id="addAccountModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>新規口座を追加</h2>
            <form id="addAccountForm">
                <div class="form-group">
                    <label for="accountName">口座名 *</label>
                    <input type="text" id="accountName" required placeholder="例: 三菱UFJ銀行">
                </div>
                <div class="form-group">
                    <label for="accountType">口座タイプ *</label>
                    <select id="accountType" required>
                        <option value="">タイプを選択...</option>
                        <option value="Savings">普通預金</option>
                        <option value="Investment">投資</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="initialBalance">初期残高（任意）</label>
                    <input type="number" id="initialBalance" min="0" step="1" placeholder="0">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelAddAccount">キャンセル</button>
                    <button type="submit" class="btn btn-primary">口座を追加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Account Modal -->
    <div id="editAccountModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>口座を編集</h2>
            <form id="editAccountForm">
                <input type="hidden" id="editAccountId">
                <div class="form-group">
                    <label for="editAccountName">口座名 *</label>
                    <input type="text" id="editAccountName" required>
                </div>
                <div class="form-group">
                    <label for="editAccountType">口座タイプ *</label>
                    <select id="editAccountType" required>
                        <option value="Savings">普通預金</option>
                        <option value="Investment">投資</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditAccount">キャンセル</button>
                    <button type="submit" class="btn btn-primary">変更を保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update Balance Modal -->
    <div id="updateBalanceModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>残高を更新</h2>
            <form id="updateBalanceForm">
                <input type="hidden" id="updateBalanceAccountId">
                <div class="form-group">
                    <label for="currentBalance">現在の残高</label>
                    <input type="text" id="currentBalance" readonly>
                </div>
                <div class="form-group">
                    <label for="newBalance">新しい残高 *</label>
                    <input type="number" id="newBalance" required min="0" step="1" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="balanceDate">日付 *</label>
                    <input type="date" id="balanceDate" required>
                </div>
                <div class="form-group">
                    <label for="balanceMemo">メモ（任意）</label>
                    <textarea id="balanceMemo" rows="3" placeholder="メモを追加..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelUpdateBalance">キャンセル</button>
                    <button type="submit" class="btn btn-primary">残高を更新</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/firebase-config.js"></script>
    <script src="js/account-manager.js"></script>
    <script src="js/balance-manager.js"></script>
    <script src="js/history.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
